<template>
    <lightning-card title="Number Guessing Game" icon-name="utility:number_input">
        <div class="slds-p-around_medium">
            <div class="slds-text-align_center slds-m-bottom_medium">
                <p class="slds-text-heading_small slds-m-bottom_small">
                    Guess a number between <strong>{minNumber}</strong> and <strong>{maxNumber}</strong>
                </p>
                <p class="slds-text-body_regular" if:true={gameStarted}>
                    Attempts: <strong>{attempts}</strong>
                </p>
            </div>

            <div class="slds-form-element slds-m-bottom_medium">
                <lightning-input
                    type="number"
                    label="Your Guess"
                    value={userGuess}
                    onchange={handleGuessChange}
                    min={minNumber}
                    max={maxNumber}
                    disabled={isInputDisabled}>
                </lightning-input>
            </div>

            <div class="slds-text-align_center slds-m-bottom_medium">
                <div class="slds-m-right_small" style="display: inline-block;">
                    <lightning-button
                        variant="brand"
                        label="Submit Guess"
                        onclick={handleSubmitGuess}
                        disabled={isSubmitDisabled}>
                    </lightning-button>
                </div>
                <lightning-button
                    variant="neutral"
                    label="New Game"
                    onclick={startNewGame}>
                </lightning-button>
            </div>

            <div if:true={gameStarted} class="slds-text-align_center">
                <div if:true={feedbackMessage} class="slds-m-top_medium">
                    <div class={feedbackClass}>
                        <p class="slds-text-heading_medium">{feedbackMessage}</p>
                        <p if:true={gameWon} class="slds-text-body_regular slds-m-top_small">
                            The number was <strong>{targetNumber}</strong>!
                        </p>
                    </div>
                </div>
            </div>

            <div if:false={gameStarted} class="slds-text-align_center slds-m-top_medium">
                <p class="slds-text-body_regular slds-text-color_weak">
                    Click "New Game" to start guessing!
                </p>
            </div>
        </div>
    </lightning-card>
</template>
